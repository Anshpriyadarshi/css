<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Over</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="scoreboard">
        <header>
            <span>🏏</span>
            <strong>SUPER<br>OVER</strong>
        </header>

        <section class="scores">
            <article class="india">
                <h1>IND</h1>
                <div class="balls">
                    <b>4</b>
                    <b>3</b>
                    <b>2</b>
                    <b>6</b>
                    <b>6</b>
                    <b>6</b>
                </div>
                <h2>27/0</h2>
            </article>

            <article class="pakistan">
                <h1>PAK</h1>
                <div class="balls">
                    <b>2</b>
                    <b>4</b>
                    <b>0</b>
                    <b>3</b>
                    <b>1</b>
                    <b>4</b>
                </div>
                <h2>14/0</h2>
            </article>
        </section>

        <footer>
            <button>🏏</button>
            <button>⟲</button>
        </footer>
    </main>
</body>

</html>
