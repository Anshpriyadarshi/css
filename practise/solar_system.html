
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Solar System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle, #101b35, #02030a 75%);
        }

        .solar-system {
            position: relative;
            width: 700px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0.85);
        }

        .sun {
            position: absolute;
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #fff7a0, #ff9800, #ff4500);
            border-radius: 50%;
            box-shadow: 0 0 30px #ff9800, 0 0 70px #ff6600;
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rotate linear infinite;
        }

        .planet {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .mercury-orbit {
            width: 120px;
            height: 120px;
            animation-duration: 4s;
        }

        .mercury {
            width: 10px;
            height: 10px;
            background: #a9a9a9;
            box-shadow: 0 0 8px #aaa;
        }

        .venus-orbit {
            width: 180px;
            height: 180px;
            animation-duration: 7s;
        }

        .venus {
            width: 17px;
            height: 17px;
            background: #e6b566;
            box-shadow: 0 0 10px #e6b566;
        }

        .earth-orbit {
            width: 250px;
            height: 250px;
            animation-duration: 10s;
        }

        .earth {
            width: 19px;
            height: 19px;
            background: #168cff;
            box-shadow: 0 0 12px #168cff;
        }

        .mars-orbit {
            width: 320px;
            height: 320px;
            animation-duration: 14s;
        }

        .mars {
            width: 14px;
            height: 14px;
            background: #ff5733;
            box-shadow: 0 0 10px #ff5733;
        }

        .jupiter-orbit {
            width: 410px;
            height: 410px;
            animation-duration: 20s;
        }

        .jupiter {
            width: 35px;
            height: 35px;
            background: linear-gradient(0deg, #a45c35, #f3d0a0, #b56b42);
            box-shadow: 0 0 12px #b56b42;
        }

        .saturn-orbit {
            width: 500px;
            height: 500px;
            animation-duration: 26s;
        }

        .saturn {
            width: 29px;
            height: 29px;
            background: #dfc27a;
            box-shadow: 0 0 10px #dfc27a;
        }

        .saturn::after {
            content: "";
            position: absolute;
            width: 48px;
            height: 12px;
            border: 3px solid #c7a86a;
            border-radius: 50%;
            top: 5px;
            left: -10px;
            transform: rotate(-20deg);
        }

        .uranus-orbit {
            width: 590px;
            height: 590px;
            animation-duration: 32s;
        }

        .uranus {
            width: 23px;
            height: 23px;
            background: #7de5e8;
            box-shadow: 0 0 12px #7de5e8;
        }

        .neptune-orbit {
            width: 680px;
            height: 680px;
            animation-duration: 40s;
        }

        .neptune {
            width: 22px;
            height: 22px;
            background: #4169ff;
            box-shadow: 0 0 12px #4169ff;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 700px) {
            .solar-system {
                transform: scale(0.48);
            }
        }

        @media (max-width: 400px) {
            .solar-system {
                transform: scale(0.38);
            }
        }
    </style>
</head>

<body>

    <div class="solar-system">

        <div class="sun"></div>

        <div class="orbit mercury-orbit">
            <div class="planet mercury"></div>
        </div>

        <div class="orbit venus-orbit">
            <div class="planet venus"></div>
        </div>

        <div class="orbit earth-orbit">
            <div class="planet earth"></div>
        </div>

        <div class="orbit mars-orbit">
            <div class="planet mars"></div>
        </div>

        <div class="orbit jupiter-orbit">
            <div class="planet jupiter"></div>
        </div>

        <div class="orbit saturn-orbit">
            <div class="planet saturn"></div>
        </div>

        <div class="orbit uranus-orbit">
            <div class="planet uranus"></div>
        </div>

        <div class="orbit neptune-orbit">
            <div class="planet neptune"></div>
        </div>

    </div>

</body>
</html>
