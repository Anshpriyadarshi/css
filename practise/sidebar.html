<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:20px;
            background-color: #8FC4CB;
        }

        .navbar{
            background-color: white;
            font-family: sans-serif;
            border-radius: 5px;
            width:200px;
        }

        .user{
            border:1px solid #E5E5E5;
            background-color: #EDF1F4;
            font-weight: bold;
            border-radius: 5px;
        }

        .user p{
            margin: 20px;
    
        }

        .dashboard a{
            text-decoration: none;
            color:black;
            margin:30px;
            display: flex;
            gap: 40px;

        }

        .dashboard li{
            list-style-type: none;
        }

        .settings a{
            text-decoration: none;
            margin:30px;
            display: flex;
            color:black;
        }

        .settings li{
            list-style-type: none;
        }

        .profile p{
            font-weight: bold;
            margin: 30px;

        }


    </style>
</head>
<body>
    <div class="navbar">
        <div class="user">
            <p>ALF Pte. Ltd.</p>
        </div>

        <div class="dashboard">
            <li><a href="">Dashboard</a></li>
            <li><a href="">Notifications</a></li>
            <li><a href="">Projects</a></li>
            <li><a href="">Tasks</a></li>
            <li><a href="">Analytics</a></li>

        </div>

        <br>

        <div class="settings">
            <li><a href="">Settings</a></li>
            <li><a href="">Support</a></li>
            
        </div>

        <div class="profile">
            <p>John Doe</p>
            <p>johndoe@gmail.com</p>

        </div>

    </div>

</body>
</html>
