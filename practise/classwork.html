<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>
        body {
            background-color: white;
            font-family: Arial;
        }

        .card {
            width: 350px;
            margin: 50px auto;
            background-color: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0px 5px 15px gray;
            text-align: center;
        }

        .top {
            background-color: royalblue;
            height: 220px;
            padding-top: 30px;
            border-bottom-left-radius: 40px;
             border-bottom-right-radius: 40px;
        }

        .top img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
        }

        .bottom {
            padding: 25px;
        }

        .bottom h2 {
            color: #222222;
        }

        .bottom p {
            color: gray;
            line-height: 1.5;
        }

        button {
            background-color: royalblue;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 10px;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <div class="card">

        <div class="top">
            <img src="https://randomuser.me/api/portraits/men/32.jpg">
        </div>

        <div class="bottom">

            <h2>David Dell</h2>

            <p>
                The lorem text the section contain
                contains header having open
                and close functionality.
            </p>

            <button>View More</button>

        </div>

    </div>

</body>
</html>
